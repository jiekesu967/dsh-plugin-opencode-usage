name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # The plugin has no dependencies and no build step: lib/ is the artifact.
      # `scripts/verify-dsh.mjs` needs a globally installed `dsh`, which CI does
      # not provide, so CI runs the hermetic contract suite only.
      - run: node --test tests/
